# ocp-g 的 namespace + 與 ocp-a 相同的前端 app code（來源 app/app.py，由 render.sh 塞入）
# 前置：跟 ocp-a 一樣建立 db-credentials secret（README 步驟 3）
apiVersion: v1
kind: Namespace
metadata:
  name: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: ${NAMESPACE}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-code
  namespace: ${NAMESPACE}
data:
  app.py: |
${APP_CODE}
