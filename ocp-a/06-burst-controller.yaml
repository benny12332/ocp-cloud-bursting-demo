# burst-controller：接收 Alertmanager webhook，呼叫 Route 53 API 調整加權
#   firing   → 進入 bursting：先用起手權重（BURST_AWS_WEIGHT / BURST_GCP_WEIGHT）把流量推到 ocp-g 喚醒 Knative，
#              之後每 RECONCILE_SECONDS 依「兩邊 ready pod 數」比例動態調整權重（BURST_MODE=proportional）
#   resolved → ocp-a:100 / ocp-g:0（回縮；ocp-g 沒流量後 Knative 自動歸零）
#
# 要讀 ocp-g 的 pod 數，需要 secret ocp-g-reader（OCP_G_API / OCP_G_TOKEN / OCP_G_CA），
# 由 scripts/setup-reader.sh 建立；沒有這個 secret 時退回 fixed 模式。
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: burst-controller
  namespace: ${NAMESPACE}
---
# 讀本地（ocp-a）frontend pod 數
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: burst-controller
  namespace: ${NAMESPACE}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: burst-controller
  namespace: ${NAMESPACE}
subjects:
  - kind: ServiceAccount
    name: burst-controller
    namespace: ${NAMESPACE}
roleRef:
  kind: Role
  name: burst-controller
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: burst-controller-code
  namespace: ${NAMESPACE}
data:
  controller.py: |
${CONTROLLER_CODE}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: burst-controller
  namespace: ${NAMESPACE}
  labels:
    app: burst-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: burst-controller
  template:
    metadata:
      labels:
        app: burst-controller
    spec:
      serviceAccountName: burst-controller
      containers:
        - name: controller
          image: registry.access.redhat.com/ubi9/python-311:latest
          command:
            - /bin/sh
            - -c
            - pip install --quiet flask boto3 requests && python /opt/app/controller.py
          env:
            - name: HOSTED_ZONE_ID
              value: "${HOSTED_ZONE_ID}"
            - name: RECORD_NAME
              value: "${RECORD_NAME}"
            - name: AWS_TARGET
              value: "${AWS_TARGET}"
            - name: GCP_TARGET
              value: "${GCP_TARGET}"
            - name: TTL
              value: "${DNS_TTL}"
            - name: AWS_DEFAULT_REGION
              value: "${AWS_REGION}"
            - name: NAMESPACE
              value: "${NAMESPACE}"
            - name: BURST_MODE
              value: "${BURST_MODE}"
            - name: BURST_AWS_WEIGHT
              value: "${BURST_AWS_WEIGHT}"
            - name: BURST_GCP_WEIGHT
              value: "${BURST_GCP_WEIGHT}"
            - name: BURST_GCP_MIN_PODS
              value: "${BURST_GCP_MIN_PODS}"
            - name: RECONCILE_SECONDS
              value: "${BURST_RECONCILE_SECONDS}"
          envFrom:
            - secretRef:
                name: aws-route53          # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
            - secretRef:
                name: ocp-g-reader         # OCP_G_API / OCP_G_TOKEN / OCP_G_CA（setup-reader.sh 建立）
                optional: true
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 128Mi }
          volumeMounts:
            - name: code
              mountPath: /opt/app
      volumes:
        - name: code
          configMap:
            name: burst-controller-code
---
apiVersion: v1
kind: Service
metadata:
  name: burst-controller
  namespace: ${NAMESPACE}
spec:
  selector:
    app: burst-controller
  ports:
    - name: http
      port: 8080
      targetPort: 8080
