# burst-controller：接收 Alertmanager webhook，呼叫 Route 53 API 調整加權
#   firing   → ocp-a:50 / ocp-g:50 （開始分流）
#   resolved → ocp-a:100 / ocp-g:0 （回縮；ocp-g 沒流量後 Knative 自動歸零）
# 前置：oc create secret generic aws-route53 --from-literal=AWS_ACCESS_KEY_ID=... --from-literal=AWS_SECRET_ACCESS_KEY=...
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: burst-controller-code
  namespace: bursting-demo
data:
  controller.py: |
    import os, json, boto3
    from flask import Flask, request, jsonify

    app = Flask(__name__)
    ZONE = os.environ["HOSTED_ZONE_ID"]
    RECORD = os.environ["RECORD_NAME"]          # 例 app.bursting.demo.example.com.
    AWS_TARGET = os.environ["AWS_TARGET"]        # 例 app-aws.bursting.demo.example.com.
    GCP_TARGET = os.environ["GCP_TARGET"]        # 例 app-gcp.bursting.demo.example.com.
    TTL = int(os.environ.get("TTL", "15"))
    r53 = boto3.client("route53")
    state = {"mode": "normal"}

    def upsert(identifier, target, weight):
        return {
            "Action": "UPSERT",
            "ResourceRecordSet": {
                "Name": RECORD, "Type": "CNAME", "TTL": TTL,
                "SetIdentifier": identifier, "Weight": weight,
                "ResourceRecords": [{"Value": target}],
            },
        }

    def set_weights(aws_w, gcp_w):
        r53.change_resource_record_sets(
            HostedZoneId=ZONE,
            ChangeBatch={"Changes": [
                upsert("ocp-a", AWS_TARGET, aws_w),
                upsert("ocp-g", GCP_TARGET, gcp_w),
            ]},
        )
        print(f"weights set: ocp-a={aws_w} ocp-g={gcp_w}", flush=True)

    @app.route("/alert", methods=["POST"])
    def alert():
        payload = request.get_json(force=True)
        status = payload.get("status", "unknown")
        names = [a.get("labels", {}).get("alertname") for a in payload.get("alerts", [])]
        print(f"webhook received: status={status} alerts={names}", flush=True)
        if status == "firing":
            set_weights(50, 50)
            state["mode"] = "bursting"
        elif status == "resolved":
            set_weights(100, 0)
            state["mode"] = "normal"
        return jsonify(ok=True, mode=state["mode"])

    @app.route("/status")
    def status():
        return jsonify(state)

    app.run(host="0.0.0.0", port=8080)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: burst-controller
  namespace: bursting-demo
  labels:
    app: burst-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: burst-controller
  template:
    metadata:
      labels:
        app: burst-controller
    spec:
      containers:
        - name: controller
          image: registry.access.redhat.com/ubi9/python-311:latest
          command:
            - /bin/sh
            - -c
            - pip install --quiet flask boto3 && python /opt/app/controller.py
          env:
            - name: HOSTED_ZONE_ID
              value: "ZXXXXXXXXXXXXX"                        # ← 改成你的 hosted zone ID
            - name: RECORD_NAME
              value: "app.bursting.demo.example.com."         # ← 改
            - name: AWS_TARGET
              value: "app-aws.bursting.demo.example.com."     # ← 改
            - name: GCP_TARGET
              value: "app-gcp.bursting.demo.example.com."     # ← 改
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          envFrom:
            - secretRef:
                name: aws-route53
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 128Mi }
          volumeMounts:
            - name: code
              mountPath: /opt/app
      volumes:
        - name: code
          configMap:
            name: burst-controller-code
---
apiVersion: v1
kind: Service
metadata:
  name: burst-controller
  namespace: bursting-demo
spec:
  selector:
    app: burst-controller
  ports:
    - name: http
      port: 8080
      targetPort: 8080
