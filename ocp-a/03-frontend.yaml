# 前端應用：小型 Flask app（程式碼在 app/app.py）
#   /            demo 面板（誰在服務 / 請求落點燈條 / PostgreSQL 內容 + 留言）
#   /whoami      回報 site / pod
#   /api/db      唯讀取 DB 內容；/api/message POST 寫留言
#   /db          寫一筆 hit 並回傳計數（驗證跨雲連 DB 用）
#   /burn        燒 CPU（觸發 HPA 用），?ms=500 控制每個 request 燒多久
# ocp-g 用同一份 code 跑 Knative Service（見 ocp-g/03、04）
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-code
  namespace: ${NAMESPACE}
data:
  app.py: |
${APP_CODE}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ${NAMESPACE}
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: registry.access.redhat.com/ubi9/python-311:latest
          command:
            - /bin/sh
            - -c
            - pip install --quiet flask "psycopg[binary]" && python /opt/app/app.py
          env:
            - name: SITE
              value: "ocp-a(AWS)"
            - name: DB_HOST
              value: postgres.${NAMESPACE}.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_SSLMODE
              value: disable
            - name: DISPLAY_TZ
              value: "${DISPLAY_TZ}"
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: db-credentials, key: user }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-credentials, key: password }
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: db-credentials, key: database }
          ports:
            - containerPort: 8080
          # requests 是 HPA 百分比的分母，也決定塞爆節點的速度——demo 的關鍵參數
          resources:
            requests: { cpu: 500m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 15
          volumeMounts:
            - name: code
              mountPath: /opt/app
      volumes:
        - name: code
          configMap:
            name: frontend-code
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ${NAMESPACE}
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# 前端 Route：host 用全域統一域名（Route 53 加權指到兩個叢集的同一個 host）
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: frontend
  namespace: ${NAMESPACE}
spec:
  host: ${APP_HOST}
  to:
    kind: Service
    name: frontend
  port:
    targetPort: http
